#
# Builds the simulation image from the Dockerfile, runs the demo inside it and,
# if the demo passes, publishes the image to the GitHub Container Registry:
#   ghcr.io/blogic-microelectronic/blogic-mcu:latest   from main
#   ghcr.io/blogic-microelectronic/blogic-mcu:v1.0     from a version tag such as v1.0
# On pull requests and other branches the image is built and tested but not published.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_TAG: blogic-mcu:test

jobs:
  image:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the demo inside the image
        run: docker run --rm "$TEST_TAG"

      # The regression uses Spike as well as Verilator and the RISC-V GCC, so it
      # checks that every tool in the image works, not only the demo.
      - name: Run the regression inside the image
        run: docker run --rm "$TEST_TAG" make regression

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
