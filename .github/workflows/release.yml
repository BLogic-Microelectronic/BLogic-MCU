#
# Creates the GitHub release for a version tag (v1.0, v1.1, ...).
#
# The large physical design outputs were removed from the repository after the
# competition. This workflow takes them from the tag `teknofest-final` (the
# repository as submitted), verifies them against the committed SHA-256 files and
# attaches them to the release, so they never have to be uploaded by hand.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true
        default: v1.0

permissions:
  contents: write

env:
  SOURCE_TAG: teknofest-final
  RESULT_DIRS: >-
    asic/results/def asic/results/gds asic/results/mag asic/results/netlist
    asic/results/odb asic/results/sdf asic/results/spef asic/results/spice

jobs:
  release:
    name: Build the release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Take the physical design outputs from ${{ env.SOURCE_TAG }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          # shellcheck disable=SC2086
          git archive "$SOURCE_TAG" $RESULT_DIRS | tar -x
          du -sh asic/results

      - name: Verify against the committed SHA-256 values
        run: bash asic/fetch_results.sh --verify

      - name: Package the release files
        run: |
          mkdir -p dist
          # shellcheck disable=SC2086
          tar -czf "dist/asic-results-$TAG.tar.gz" $RESULT_DIRS
          cp asic/results/gds/asic_top.gds.gz "dist/asic_top-$TAG.gds.gz"
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create or update the release
        run: |
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || notes=".github/release-notes/default.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "BLogic MCU $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/* --clobber
