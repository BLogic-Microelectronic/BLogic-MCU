# --- Saat ve zamanlama kisitlari ---
# 20 ns = 50 MHz hedef. PnR ve signoff AYNI SDC'yi kullanir (bolum 3.2/6.2);
# design.sdc icinde olculmus SRAM derate (2,661x) ve IO butceleri tanimlidir.
CLOCK_PORT: clk_i
CLOCK_PERIOD: 20
PNR_SDC_FILE: dir::design_jtag.sdc   # design.sdc + JTAG saati (jtag_asic_config.py)
SIGNOFF_SDC_FILE: dir::design_jtag.sdc   # design.sdc + JTAG saati (jtag_asic_config.py)

