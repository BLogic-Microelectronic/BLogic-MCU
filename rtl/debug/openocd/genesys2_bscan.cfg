# ============================================
# Ostim BLogic Mikroelektronik
# genesys2_bscan.cfg  -  OpenOCD: Genesys 2 kart USB-JTAG -> BSCANE2 -> riscv-dbg
# ============================================
# deneme/jtag dali. Kullanim:
#   openocd -f rtl/debug/openocd/genesys2_bscan.cfg
# Onkosul:
#   - Kartta fpga_top_jtag.bit yuklu (rtl/fpga/build_genesys2_jtag.tcl ciktisi).
#     TAP, FPGA'nin kendi zincirine dmi_bscane_tap.sv ile (USER3 = dtmcs,
#     USER4 = dmi) baglidir; harici JTAG kablosu GEREKMEZ.
#   - Vivado hw_server KAPALI olmali: kart uzerindeki FT2232H'in A kanalini
#     hw_server ile OpenOCD ayni anda acamaz.
#   - Windows'ta OpenOCD'nin 'ftdi' surucusu libusb ister: ya Zadig ile
#     "Digilent USB Device (Interface 0)" -> WinUSB (Vivado programlama icin
#     geri alinmali), ya da usbipd-win ile karti WSL2'ye verip OpenOCD'yi
#     Linux tarafinda kosturun (Windows surucusu bozulmaz, tercih edilen).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
# KANAL 1 (B)! 6 Eylul 2026 kartta olculdu: kanal 0 ile tarama zinciri hep sifir
# ('all zeroes', IR capture 0x00); kanal 1 ile Kintex-7 TAP'i bulundu
# (0x43651093, mfg Xilinx). Genesys 2'de FT2232H'nin B kanali JTAG'a gider;
# A kanali bos. UART ayri bir FT232R cipidir (0403:6001, COM7) - etkilenmez.
ftdi channel 1
# Digilent JTAG-SMT2-NC pin haritasi (OpenOCD interface/ftdi/digilent_jtag_smt2_nc.cfg
# ile ayni; o dosya 'device_desc Digilent USB Device' istedigi icin dogrudan
# kullanilamiyor - usbipd uzerinden gelen cihazda aciklama alani eslesmedi)
ftdi layout_init 0x00e8 0x60eb
reset_config none
adapter speed 5000
transport select jtag

# Zincirde tek TAP: Kintex-7 325T (IDCODE x3651093; surum nibble'i degisir)
set _CHIPNAME xc7k325t
jtag newtap $_CHIPNAME tap -irlen 6 -expected-id 0x03651093 -ignore-version

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.tap

# BSCANE2 uzerinden DTM: 7-serisi IR kodlari IDCODE=0x09, USER3=0x22, USER4=0x23
# (dmi_bscane_tap.sv: JTAG_CHAIN 3 -> dtmcs, JTAG_CHAIN 4 -> dmi)
riscv set_ir idcode 0x09
riscv set_ir dtmcs  0x22
riscv set_ir dmi    0x23

# SBA bagli degil (blogic_sim.cfg ile ayni gerekce) -> program buffer
riscv set_mem_access progbuf

init
halt
