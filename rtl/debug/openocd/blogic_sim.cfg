# ============================================
# Ostim BLogic Mikroelektronik
# blogic_sim.cfg  -  OpenOCD: Verilator simulasyonuna remote_bitbang ile baglanti
# ============================================
# JTAG debug altsistemi (teslim cipinin parcasi; JTAG_DEBUG teslim
# yapilandirmasinda ACIK). Kullanim:
#   openocd -f rtl/debug/openocd/blogic_sim.cfg
# Simulasyon tarafinda SimJTAG (rtl/debug/vendor/riscv-dbg/tb/SimJTAG.sv)
# ayni portu dinler. FPGA icin adapter satirlari kart probuna gore degisir,
# TAP/target tanimi ayni kalir.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9999
transport select jtag
adapter speed 10000

set _CHIPNAME blogic
# IR uzunlugu 5 (riscv-dbg dmi_jtag_tap); IDCODE soc_top JTAG_IDCODE
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x0B1061C1

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# SBA bagli degil (soc_top: hata ile tamamlanan tie-off) -> bellek erisimi
# yalniz program buffer uzerinden. sbcs sbaccess32 ilan ettigi icin bu
# satir ZORUNLU; yoksa OpenOCD SBA'yi dener ve her erisim hata alir.
riscv set_mem_access progbuf

# Gun 3: ndmreset soc_top sys_rst_n'e bagli (rst_ni & ~ndmreset) -> "reset halt"
# gecerli (demo_halt_regs_mem.tcl kullanir; reset_config varsayilani "none",
# yani yalniz dmcontrol.ndmreset, DM + TAP ayakta kalir). Baslangic yine
# init + halt: cekirdek firmware icinde durur, register/bellek demosu oradan.
init
halt
