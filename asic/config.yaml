# --- Saat agaci (CTS) ---
# 3-4 Eylul 2026 olcumu (12 varyantlik tarama: rtl/debug/asic_jtag_sentez/full_v3/
# varyant_taramasi.txt ve OZET.md). JTAG DM eklenince CTS'in gecikme-dengeleme
# zinciri (8x clkbuf_16) CPU dalindan komut-SRAM dalina kaymis, TT setup marji
# +2,210 -> +1,060 ns'ye dusmustu. Makro saat alt-agaci kumelemesi + engel-farkindali
# CTS + saat teli tavani ile TT +1,684 ns (6 Eylul kosusu RUN_final_2026-09-06 - TARIHSEL,
# superseded). O kosuda hold TT'de JTAG'siz seviyeye donmus (-0,309 vs -0,323), FF'te daha iyi
# cikmis (-0,290 vs -0,382), 14 Agustos kosusunda temiz olan SS'te 5 uc nokta -0,122 ns kalmisti;
# IR-drop 1,54 -> 0,95 mV. Teslim kosusunda (RUN_hold035_2026-09-09, ayni CTS ayarlari) hold uc
# kosede KAPALI: +0,165 / +0,637 / +0,040 ns (TT/SS/FF, 0 uc nokta; hold onarimi asagidaki
# "Zamanlama onarimi" blogunda, README 9.7 ve 9.9/2); TT setup @ 20 ns +1,218 ns (hold
# hucrelerinin setup bedeli), TT saat agaci skew'u 1,882 -> 1,793 ns, IR-drop 0,96 mV.
# Etkisiz olculen anahtarlar (CTS_DELAY_BUFFER_DERATE_PCT, CTS_MAX_CAP) ve zararli olan
# (resizer setup marji 0.15) bilerek YOK.
CTS_MACRO_CLUSTERING_MAX_DIAMETER: 600
CTS_MACRO_CLUSTERING_SIZE: 2
CTS_OBSTRUCTION_AWARE: true
CTS_CLK_MAX_WIRE_LENGTH: 900

# --- Zamanlama onarimi ---
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 10
RUN_POST_GRT_RESIZER_TIMING: true   # PnR-ici hold onarimi (11 Agu, JTAG'siz RTL, PnR-ici tt kontrolu: 63 -> 10).
                                    # Tarihsel: 6 Eylul kosusu (RUN_final_2026-09-06, superseded) varsayilan
                                    # marjla (0.10, ALLOW_SETUP_VIOS kapali) tt 87 / ss 5 / ff 142 hold ihlali
                                    # ve netlistte yalnizca 115 hold gecikme hucresi (hold9290..hold9404) ile
                                    # bitmisti (mekanizma README 9.9/2). Teslim kosusu RUN_hold035_2026-09-09:
                                    # 0 / 0 / 0 hold ihlali (+0,165 / +0,637 / +0,040 ns TT/SS/FF), netlistte
                                    # 10.509 hold hucresi (10.467 dlygate4sd3_1 + 42 tampon; README 9.9/2, 9.11).
# *_RESIZER_HOLD_SLACK_MARGIN (0.35) ve *_RESIZER_ALLOW_SETUP_VIOS (true) 9 Eylul 2026'da YAZILDI
# (yukarida "Saat ve zamanlama kisitlari" blogunda; README 9.7). Marj tepkisi ayni RTL/floorplan ile
# RCX sonrasi hold uzerinden OLCULDU (README 9.9/12; hucre = eklenen hold gecikme hucresi):
#   0.15 -> 201 hucre, PnR-ici +0,150 ama RCX sonrasi -0,159 ns (parazitik kaymasi ~0,31 ns);
#   0.30 -> 9.677 hucre, FF'te 1 uc nokta -0,044 ns;
#   0.35 -> 10.509 hucre, uc kosede temiz (+0,165 / +0,637 / +0,040)  <- TESLIM;
#   0.40 -> 11.031 hucre, hedefe ulasamadi (-1,530; tepki monoton degil, calisan pencere ~0.30-0.35).
# Setup bedeli: netlistin setup kapanis noktasi 35,0 ns = 28,6 MHz (6 Eylul) -> 36,6 ns = 27,3 MHz;
# beyan 27,0 MHz @ 37,000 ns (SS +0,197 ns pay; README 9.1). Daha eski olcum (3-11 Agu, JTAG'siz
# RTL, o tarihte SS setup tabani -9.08 ns): 0.3 -> hold degismedi, SS setup -10.3'e coktu;
# 0.5 -> arac cokmesi.
# *_RESIZER_SETUP_SLACK_MARGIN hala bilerek YOK -> LibreLane 3.0.6 varsayilanlari (PL 0.05 / GRT 0.025):
# LibreLane ayni degiskeni hold onarimina da -setup_margin olarak gecirir (rsz_timing_postcts.tcl:45),
# buyutmek hold onarimini kilitler (kaynak incelemesiyle reddedildi, README 9.9/12).
RSZ_CORNERS:   # onarim 3 kosede — DDK bolum 1.2 kose seti
  - nom_tt_025C_1v80
  - nom_ss_100C_1v60
  - nom_ff_n40C_1v95

# --- STA (DDK Tablo 4: uc zorunlu signoff kosesi) ---
STA_CORNERS:
  - nom_tt_025C_1v80
  - nom_ss_100C_1v60
  - nom_ff_n40C_1v95
DEDUPLICATE_CORNERS: true

# --- Signoff ---
# Ip-5'te acilacak: RUN_KLAYOUT_DRC: true (bolum 5.6 zorunlu raporu).
# ERROR_ON_* bayraklari akisi durdurmamak icin kapali; sonuclar gizlenmiyor,
# raporlar oldugu gibi teslim ediliyor (bolum 7 cercevesi, README 9.9 aciklamasi).
RUN_MAGIC_WRITE_LEF: true
MAGIC_DRC_USE_GDS: false
# Gercek (GDS tabanli) LVS cikarimi — teslim kosusunda (RUN_hold035_2026-09-09)
# 0 hata / 0 cihaz farki: ust seviye 103.699 cihaz / 92.242 ag (2.153.654 paralel
# cihaz birlestirildikten sonra; README 9.9/5). 197'lik eski farklar dar-kanal
# floorplanina aitti ve genis kanalla kapandi (11 Agu genis-kanal dondurma adayi:
# 1.795.705 eleman). MAGIC_CAPTURE_ERRORS kapali cunku makro GDS'i
# okunurken uretilen uyarilar LibreLane'in sezgisel yakalayicisini
# tetikliyor (dokuman: "fatal olduklari garanti degildir"); Magic DRC'nin
# tek kalan kural sinifi (nwell.4) icin olculmus degerlendirme README
# 9.9/4'tedir.
MAGIC_EXT_USE_GDS: true
MAGIC_CAPTURE_ERRORS: false
RUN_KLAYOUT_DRC: true
KLAYOUT_DRC_THREADS: 8
ERROR_ON_MAGIC_DRC: false
ERROR_ON_KLAYOUT_DRC: false
ERROR_ON_LVS_ERROR: false
ERROR_ON_XOR_ERROR: false
ERROR_ON_TR_DRC: false
