# PLAN D genisletilmis: sutun kanali 209->300 um, satir arasi 60->100 um.
# Olculdu (VM-2, 3.0.6): route DRC 1348 -> 0, yakinsama 195 -> 10 iterasyon.
# Bedel: die 16,73 -> 18,77 mm2 (+%12,2). Deney zinciri: BELLEK_ENVANTERI.md.
