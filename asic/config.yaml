# --- Saat ve zamanlama kisitlari ---
# IKI SDC teslim edilir (LibreLane 3.0.6 PNR_SDC_FILE / SIGNOFF_SDC_FILE mekanizmasi,
# librelane/steps/openroad.py:323 ve :970; bolum 6.2, README 9.1/9.6):
#   PnR     : constraints/design.sdc         create_clock -period 20.000 -> 50 MHz HEDEF
#             (CLOCK_PERIOD: 20 ile AYNI olmak zorunda, README 9.13 tutarlilik kurali).
#   Signoff : constraints/design_signoff.sdc create_clock -period 37.000 -> 27,0 MHz DOGRULANMIS
#             calisma frekansi (uc kosede setup VE hold kapali, SS setup +0,197 ns; olculen
#             kapanis noktasi 36,6 ns = 27,3 MHz, periyot taramasi README 9.1).
# Iki dosya clk periyodu disinda birebir aynidir: olculmus SRAM derate (2,661x), IO butceleri ve
# JTAG TAP saati (jtag_tck, 100 ns = OpenOCD adapter tavani 10 MHz) her ikisinde de tanimlidir;
# clk <-> jtag_tck ASENKRON saat grubudur, gecisler riscv-dbg dmi_cdc (2-faz el sikisma) ile korunur.
CLOCK_PORT: clk_i
CLOCK_PERIOD: 20
# Hold onarimi ayarlari - teslim kosusu RUN_hold035_2026-09-09'un 6 Eylul kosusuna gore tek
# yapilandirma farki (9 Eylul 2026; README 9.7). Varsayilan marj (0.10) + ALLOW_SETUP_VIOS kapali
# iken resizer 50 MHz setup baskisi altinda hold onarimini erken birakiyordu (6 Eylul: tt 87 /
# ss 5 / ff 142 ihlal). 0.35 marj + ALLOW_SETUP_VIOS ile hold uc kosede kapandi
# (+0,165 / +0,637 / +0,040 ns TT/SS/FF, 0 uc nokta; 10.509 hold hucresi). Marj taramasi ve
# setup bedeli: asagidaki "Zamanlama onarimi" blogu ve README 9.9/12.
GRT_RESIZER_ALLOW_SETUP_VIOS: true
PL_RESIZER_ALLOW_SETUP_VIOS: true
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.35
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
PNR_SDC_FILE: dir::constraints/design.sdc
SIGNOFF_SDC_FILE: dir::constraints/design_signoff.sdc

