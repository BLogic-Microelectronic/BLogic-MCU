# --- Zamanlama onarimi ---
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 10
RUN_POST_GRT_RESIZER_TIMING: true   # hold onarimi (63 -> 10 ihlal, olculdu)
RSZ_CORNERS:   # onarim 3 kosede — DDK bolum 1.2 kose seti
  - nom_tt_025C_1v80
  - nom_ss_100C_1v60
  - nom_ff_n40C_1v95

# --- STA ---
# Ip-5 (16 Agu ozellik dondurmasi) ile 3 koseye cikarilacak:
#   nom_tt_025C_1v80, nom_ss_100C_1v60, nom_ff_n40C_1v95  (DDK Tablo 4)
# Su an tek kose: VM dogrulama kosusuyla birebir kiyas icin.
STA_CORNERS:
  - nom_tt_025C_1v80
DEDUPLICATE_CORNERS: true

# --- Signoff ---
# Ip-5'te acilacak: RUN_KLAYOUT_DRC: true (bolum 5.6 zorunlu raporu).
# ERROR_ON_* bayraklari akisi durdurmamak icin kapali; sonuclar gizlenmiyor,
# raporlar oldugu gibi teslim ediliyor (bolum 7 cercevesi, README 9.9 aciklamasi).
RUN_MAGIC_WRITE_LEF: true
MAGIC_DRC_USE_GDS: false
RUN_KLAYOUT_DRC: false
KLAYOUT_DRC_THREADS: 8
ERROR_ON_MAGIC_DRC: false
ERROR_ON_KLAYOUT_DRC: false
ERROR_ON_LVS_ERROR: false
ERROR_ON_XOR_ERROR: false
ERROR_ON_TR_DRC: false
