  - ASIC_SRAM_MACRO   # SRAM makrolarini secer (ifndef korumali RTL dallari)
  - BOOTROM_CONTENT   # boot ROM icerigini gomer

USE_SLANG: true
SLANG_ARGUMENTS:
  - --keep-hierarchy
SYNTH_HIERARCHY_MODE: deferred_flatten

# --- Saat ---
# 20 ns = 50 MHz hedef. SDC dosyasi baglama isi (constraints/design.sdc)
# Ip-1/Ip-5 kapsaminda; su an LibreLane'in CLOCK_PORT/PERIOD'dan urettigi
# varsayilan SDC kullaniliyor ve bu README 9.6'da beyan edilecek.
CLOCK_PORT: clk_i
CLOCK_PERIOD: 20

# --- SRAM makro gorunumleri (depo ici; Tablo 8 asic/macros yapisi) ---
# Kaynak: referans PDK kurulumu (Open PDKs 8afc834), Tablo 5 onayli makrolar.
# PDK dagitimi yalniz TT_1p8V_25C Liberty icerir; SS/FF kapsamasi README 9.5'te
# aciklanir (bolum 1.2'nin izin verdigi belgeleme yolu).
EXTRA_LEFS:
  - dir::macros/sky130_sram_2kbyte_1rw1r_32x512_8/lef/sky130_sram_2kbyte_1rw1r_32x512_8.lef
  - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/lef/sky130_sram_1kbyte_1rw1r_32x256_8.lef
EXTRA_LIBS:
  - dir::macros/sky130_sram_2kbyte_1rw1r_32x512_8/lib/sky130_sram_2kbyte_1rw1r_32x512_8_TT_1p8V_25C.lib
  - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/lib/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib
EXTRA_GDS:   # 3.0.x adi; eski EXTRA_GDS_FILES deprecated
  - dir::macros/sky130_sram_2kbyte_1rw1r_32x512_8/gds/sky130_sram_2kbyte_1rw1r_32x512_8.gds
  - dir::macros/sky130_sram_1kbyte_1rw1r_32x256_8/gds/sky130_sram_1kbyte_1rw1r_32x256_8.gds

# --- Floorplan ---
# PLAN D: 4 sutun x 7 sira makro dizisi + merkezi mantik koridoru.
# Olcum gecmisi ve gerekce: asic/BELLEK_ENVANTERI.md
DIE_AREA: [0, 0, 3900, 4290]
CORE_AREA: [60, 60, 3840, 4230]
FP_SIZING: absolute
PL_TARGET_DENSITY_PCT: 35
PL_MAX_DISPLACEMENT_Y: 300
MACRO_PLACEMENT_CFG: dir::macro_placement.cfg

# --- PDN ---
PDN_MULTILAYER: true   # 3.0.x adi; eski FP_PDN_MULTILAYER deprecated
PDN_MACRO_CONNECTIONS:
  - .*\.u_macro VPWR VGND vccd1 vssd1
  - .*\.u_input_mem VPWR VGND vccd1 vssd1
  - .*\.u_conv_w_mem VPWR VGND vccd1 vssd1

# --- Yonlendirme ---
# ROUTING_OBSTRUCTIONS gerekcesi: SRAM makro LEF'lerinde OBS bolumu tanimli
# degil; yonlendirici makro alanini serbest sanip met5'e sinyal atiyor ve
# PDN'in met5 yatay strap'leriyle kisa devre uretiyordu (olculdu: 1456 DRC'nin
# tamami met5, tamami makro sutunlarinda). Makro ayak izleri met5'te sinyale
# kapatildi; met3/met4 acik cunku makro pinleri orada (LEF: 16 met3 + 109 met4).
# met1/met2 engeli DENENDI ve GERI ALINDI: kapasite cokusu (olculdu: 9498 DRC,
# yarisi makro disi). Nihai deger K-RUN hukmune gore Ip-5'te kesinlesir.
GRT_ALLOW_CONGESTION: true
GRT_OVERFLOW_ITERS: 25
RUN_ANTENNA_REPAIR: true
RUN_HEURISTIC_DIODE_INSERTION: true
