# --- Yonlendirme ---
# ROUTING_OBSTRUCTIONS gerekcesi (11 Agu duzeltmesi): SRAM makro LEF'i
# met1/met2'yi OBS ile kapatir (satir 904: tam ayak izi), met3 kismen kapali
# (+16 pin), met4'te 109 pin; met5'te ise NE PIN NE OBS vardir. Yonlendirici
# bu yuzden makro ustunde met5'i serbest sanip PDN'in met5 yatay strap'leriyle
# kisa devre uretiyordu (olculdu: 1456 DRC'nin tamami met5, makro sutunlarinda).
# met5 kutulari LEF'in eksik OBS'unu config'ten tamamlar; met1/met2 kutulari
# LEF OBS'uyla ortusur (zararsiz tekrar) ve sifir-DRC olcumu bu setle alindigi
# icin dondurma disiplini geregi aynen korunur.
# Topluluk kiyasi: riscduino tum-alan met5 GRT_OBS, openram_testchip
# RT_MAX_LAYER=met4 kullanmis; met4 tavani BIZDE olculdu ve coktu (~7.900) —
# cerrahi met5 + genis kanal, olcumle secilen cozumdur.
GRT_ALLOW_CONGESTION: true
GRT_OVERFLOW_ITERS: 25
# Anten: teslim kosusunda anten onarimi 173 diyot ekledi (antenna_diodes_count; 6 Eylul: 101);
# sezgisel diyot yerlestirmeyle birlikte netlistte toplam 96.292 diode_2 hucresi var (README 9.11).
# Kalan 2 ag / 2 pin met1 oran ihlali (hold onarimiyla olusan/uzayan agler) beyan edilen
# istisnadir, README 9.9/14.
RUN_ANTENNA_REPAIR: true
RUN_HEURISTIC_DIODE_INSERTION: true
